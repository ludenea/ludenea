name: Documentation

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the API documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
        with:
          make-default: false
      - run: cargo xtask doc
      # Stable rustdoc has no workspace index page; the simulation crate is
      # the entry point and its sidebar lists every other crate.
      - name: Redirect the root page
        run: |
          echo '<meta http-equiv="refresh" content="0; url=ludenea_sim/index.html">' > target/doc/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
