# Research CI: builds and runs the throwaway spikes under spikes/, and the
# throwaway prototypes under prototypes/, on every platform and architecture
# of the engine's first compatibility boundary, and publishes their
# measurements as artifacts. It is distinct from any future
# product CI and may be discarded with the spikes. The logic lives in
# spikes/ci/run-spike.sh and spikes/ci/summarize.sh so that it does not depend
# on GitHub Actions.
#
# Every run is a measurement, so runs are never cancelled by later runs.
# On demand, a run can pick another spike, extra Rust flags (for example a
# raised instruction set baseline), a Cargo profile (an unoptimized build),
# another C and C++ compiler for a C or C++ spike (for example Clang where the
# image's default is MSVC) and another set of cells (for example the oldest
# runner images the engine's baseline must support, or a Linux cell inside a
# minimal container image).
#
# On a schedule, a run measures the visual reference round trip spike: the key
# each cell reports is recorded every day for eight weeks, from 13 November
# 2026 to 7 January 2027, to count how often a hosted runner's key moves
# (spikes/visual-reference-round-trip/key-record.sh reads the record). The two
# schedules name those days and no others of the winter; they are to be
# removed once the record is read, or they start again in November.
name: Research CI

on:
  schedule:
    - cron: "23 5 * 11,12 *"
    - cron: "23 5 1-7 1 *"
  push:
    branches: [main]
    paths:
      - "spikes/**"
      - "!spikes/**/*.md"
      - "prototypes/**"
      - "!prototypes/**/*.md"
      - ".github/workflows/research-ci.yml"
  pull_request:
    paths:
      - "spikes/**"
      - "!spikes/**/*.md"
      - "prototypes/**"
      - "!prototypes/**/*.md"
      - ".github/workflows/research-ci.yml"
  workflow_dispatch:
    inputs:
      spike:
        description: "Spike directory under spikes/, or prototype directory under prototypes/, to build and run"
        type: string
        default: platform-facts
      rustflags:
        description: "Extra RUSTFLAGS for Rust spikes, for example -C target-cpu=x86-64-v3; recorded next to the measurements"
        type: string
        default: ""
      cells:
        description: 'Cells to run as a JSON list of {"cell": label, "runner": runner label, "container": optional image for a Linux runner}; empty runs the five cells of the boundary'
        type: string
        default: ""
      profile:
        description: "Cargo profile for Rust spikes: release (default) or dev for an unoptimized build with debug assertions"
        type: string
        default: release
      cxx:
        description: "C and C++ compiler for a C or C++ spike, for example clang-cl or clang++; empty keeps the platform's default"
        type: string
        default: ""

permissions:
  contents: read

env:
  # The spike a run on demand names; on a schedule, the spike whose keys are
  # recorded; on a push or a pull request, the platform facts.
  SPIKE: ${{ inputs.spike || (github.event_name == 'schedule' && 'visual-reference-round-trip') || 'platform-facts' }}
  RUSTFLAGS: ${{ inputs.rustflags }}
  SPIKE_PROFILE: ${{ inputs.profile || 'release' }}
  # CMake reads the compiler of a C or C++ spike from these; the run script
  # records them in the environment file.
  CC: ${{ inputs.cxx }}
  CXX: ${{ inputs.cxx }}

jobs:
  resolve:
    # Resolves every container image the cells name to the digests of its
    # manifest index and of its per-platform manifests, so that a run inside a
    # container is identified by digest and not by a tag that moves; the spike
    # job records the result in its environment file. Nothing to resolve when
    # no cell names a container.
    name: resolve container images
    runs-on: ubuntu-24.04
    outputs:
      manifests: ${{ steps.resolve.outputs.manifests }}
    steps:
      - name: Resolve the container images named by the cells
        id: resolve
        shell: bash
        env:
          CELLS: ${{ inputs.cells }}
        run: |
          manifests='{}'
          for image in $(jq -r '[.[] | .container // empty] | unique | .[]' <<<"${CELLS:-[]}"); do
            index="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}')"
            manifests="$(jq -c --arg image "$image" --argjson index "$index" '. + {($image): ($index | tojson)}' <<<"$manifests")"
          done
          echo "manifests=$manifests" >> "$GITHUB_OUTPUT"

  spike:
    name: ${{ matrix.cell }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    # A Linux cell may name a container image: the job then runs inside it
    # (a minimal image without display, GPU or audio libraries is the headless
    # research's reproducible environment). Without one, the job runs on the
    # runner directly.
    container: ${{ matrix.container }}
    strategy:
      # Every cell is a measurement: one failing cell must not cancel the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells || '[{"cell":"linux-x86_64","runner":"ubuntu-24.04"},{"cell":"linux-arm64","runner":"ubuntu-24.04-arm"},{"cell":"windows-x86_64","runner":"windows-2025"},{"cell":"windows-arm64","runner":"windows-11-arm"},{"cell":"macos-arm64","runner":"macos-15"}]') }}
    env:
      CELL: ${{ matrix.cell }}
      # Empty outside a container; otherwise the image as named and the JSON of
      # its manifest index with its digests, resolved by the job above.
      SPIKE_CONTAINER_IMAGE: ${{ matrix.container }}
      SPIKE_CONTAINER_MANIFEST: ${{ matrix.container && fromJSON(needs.resolve.outputs.manifests)[matrix.container] || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and run the spike
        shell: bash
        run: bash spikes/ci/run-spike.sh "$SPIKE" "$CELL"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SPIKE }}-${{ matrix.cell }}
          path: spikes/out/
          if-no-files-found: error

  compare:
    name: compare cells
    needs: spike
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.SPIKE }}-*
          path: out
          merge-multiple: true
      - name: Summarize the measurements per cell
        shell: bash
        run: bash spikes/ci/summarize.sh "$SPIKE" out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SPIKE }}-all-cells
          path: out/
          if-no-files-found: error
