# Research CI: builds and runs the throwaway spikes under spikes/ on every
# platform and architecture of the engine's first compatibility boundary, and
# publishes their measurements as artifacts. It is distinct from any future
# product CI and may be discarded with the spikes. The logic lives in
# spikes/ci/run-spike.sh and spikes/ci/summarize.sh so that it does not depend
# on GitHub Actions.
#
# Every run is a measurement, so runs are never cancelled by later runs.
# On demand, a run can pick another spike, extra Rust flags (for example a
# raised instruction set baseline), a Cargo profile (an unoptimized build) and
# another set of cells (for example the oldest runner images the engine's
# baseline must support).
name: Research CI

on:
  push:
    branches: [main]
    paths:
      - "spikes/**"
      - "!spikes/**/*.md"
      - ".github/workflows/research-ci.yml"
  pull_request:
    paths:
      - "spikes/**"
      - "!spikes/**/*.md"
      - ".github/workflows/research-ci.yml"
  workflow_dispatch:
    inputs:
      spike:
        description: "Spike directory under spikes/ to build and run"
        type: string
        default: platform-facts
      rustflags:
        description: "Extra RUSTFLAGS for Rust spikes, for example -C target-cpu=x86-64-v3; recorded next to the measurements"
        type: string
        default: ""
      cells:
        description: 'Cells to run as a JSON list of {"cell": label, "runner": runner label}; empty runs the five cells of the boundary'
        type: string
        default: ""
      profile:
        description: "Cargo profile for Rust spikes: release (default) or dev for an unoptimized build with debug assertions"
        type: string
        default: release

permissions:
  contents: read

env:
  SPIKE: ${{ inputs.spike || 'platform-facts' }}
  RUSTFLAGS: ${{ inputs.rustflags }}
  SPIKE_PROFILE: ${{ inputs.profile || 'release' }}

jobs:
  spike:
    name: ${{ matrix.cell }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every cell is a measurement: one failing cell must not cancel the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells || '[{"cell":"linux-x86_64","runner":"ubuntu-24.04"},{"cell":"linux-arm64","runner":"ubuntu-24.04-arm"},{"cell":"windows-x86_64","runner":"windows-2025"},{"cell":"windows-arm64","runner":"windows-11-arm"},{"cell":"macos-arm64","runner":"macos-15"}]') }}
    env:
      CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and run the spike
        shell: bash
        run: bash spikes/ci/run-spike.sh "$SPIKE" "$CELL"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SPIKE }}-${{ matrix.cell }}
          path: spikes/out/
          if-no-files-found: error

  compare:
    name: compare cells
    needs: spike
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.SPIKE }}-*
          path: out
          merge-multiple: true
      - name: Summarize the measurements per cell
        shell: bash
        run: bash spikes/ci/summarize.sh "$SPIKE" out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SPIKE }}-all-cells
          path: out/
          if-no-files-found: error
