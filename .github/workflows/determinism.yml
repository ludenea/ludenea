name: determinism

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The checks that do not depend on the platform, run once: formatting, the API documentation,
  # and clippy on WebAssembly, with warnings denied. `cargo xtask check` runs them locally, with
  # the host clippy of the native jobs; its tests fail if a check is missing here.
  lint:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The desktop backend, outside the workspace with a lockfile of its own.
      - run: cargo fmt --manifest-path editor/apps/desktop/src-tauri/Cargo.toml --all --check
      - run: cargo doc --locked --no-deps --workspace
      # The browser: the facade's entry, the Web Worker transport, and the viewport renderer.
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p ludenea -p ludenea-control -p boxes --lib -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p ludenea-debug-draw --features render --lib -- -D warnings
      # WebAssembly outside the browser: the command line tool that verifies the goldens.
      - run: cargo clippy --locked --target wasm32-wasip1 -p boxes --bins -- -D warnings

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Verify the golden trace
        shell: bash
        run: |
          for threads in 1 2 8; do
            cargo run --locked --release -p boxes -- verify examples/boxes/assets/boxes.scene.ron --inputs examples/boxes/assets/boxes.inputs --golden golden/boxes.trace --threads $threads
          done
      - name: Verify the golden replay
        shell: bash
        run: |
          for threads in 1 2 8; do
            cargo run --locked --release -p boxes -- verify golden/spawner.replay --threads $threads
          done
      - name: Upload the divergence dump
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dump-${{ matrix.os }}
          path: dump/
          if-no-files-found: ignore

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: cargo build --locked --release --target wasm32-wasip1 -p boxes --bin boxes
      - run: wasmtime run --dir=. target/wasm32-wasip1/release/boxes.wasm verify examples/boxes/assets/boxes.scene.ron --inputs examples/boxes/assets/boxes.inputs --golden golden/boxes.trace
      - run: wasmtime run --dir=. target/wasm32-wasip1/release/boxes.wasm verify golden/spawner.replay

  editor:
    runs-on: ubuntu-24.04
    # Above the end-to-end budget (thirteen tests of at most 20 minutes each on CI) plus the
    # builds and checks before it, so a hang is cut off without cutting a cold run short.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # `target` holds the end-to-end projects' shared target directory, `target/e2e`, as well:
      # the action caches `target` whole and cleans the profiles it finds at any depth, so the
      # nested one is kept like the others.
      - uses: Swatinem/rust-cache@v2
      # The pnpm version comes from `packageManager` in editor/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm -C editor install --frozen-lockfile
      - run: pnpm -C editor exec playwright install --with-deps chromium
      - run: pnpm -C editor build:wasm
      - run: pnpm -C editor typecheck
      - run: pnpm -C editor test
      # Regenerated from scratch, so a removed or renamed type leaves a stale file behind
      # as a difference too.
      - name: Check the generated files are current
        shell: bash
        run: |
          rm -rf editor/packages/control-client/src/generated
          cargo test --locked -p ludenea-control --test typescript
          cargo test --locked -p ludenea-project --test typescript
          rm crates/ludenea-project/types/*.d.ts
          node editor/scripts/bundle-dts.mjs
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - run: cargo test --locked -p ludenea-project -- --ignored
      - run: cargo xtask wasm-game boxes editor/e2e/golden/pkg
      - run: cargo run --locked -p boxes --bin editor-bench
      - run: pnpm -C editor build
      - run: cargo build --locked -p ludenea-serve --features embed-editor
      - run: cargo build --locked -p ludenea-serve
      # The performance test only reports its numbers here: it asserts on the reference
      # machine (PERF_STRICT=1).
      - run: pnpm -C editor e2e
      - name: Upload the end-to-end results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e
          path: editor/test-results/
          if-no-files-found: ignore

  timing:
    runs-on: macos-14
    # Shared runners measure noisily: the timing and memory budgets are reported, not enforced.
    continue-on-error: true
    # A cold release build plus the tests, with room to spare: a hang is cut off.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run the timing and memory tests in release
        run: cargo test --locked --release -p ludenea-control --test branches --test divergence -- --ignored --nocapture

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # The whole repository: src-tauri patches a crate from vendor/.
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install the WebView libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      # The engine (the viewport renderer) and the Tauri backend, which has a lockfile of its own.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            editor/apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm -C editor install --frozen-lockfile
      # The desktop front end bundles the viewport renderer and the shared modules.
      - run: pnpm -C editor build:wasm
      - run: pnpm -C editor/shared build
      - run: pnpm -C editor/apps/desktop build
      - run: cargo clippy --manifest-path editor/apps/desktop/src-tauri/Cargo.toml --locked -- -D warnings
      - run: cargo build --manifest-path editor/apps/desktop/src-tauri/Cargo.toml --locked
