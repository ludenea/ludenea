name: determinism

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The checks that do not depend on the platform, run once: formatting, the API documentation,
  # and clippy on WebAssembly, with warnings denied. `cargo xtask check` runs them locally, with
  # the host clippy of the native jobs; its tests fail if a check is missing here.
  lint:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # gilrs, the native window's gamepad library, builds against libudev on Linux.
      - name: Install libudev
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The desktop backend, outside the workspace with a lockfile of its own.
      - run: cargo fmt --manifest-path editor/apps/desktop/src-tauri/Cargo.toml --all --check
      # Its lockfile follows the engine crates it builds: a new engine dependency must land in it.
      - run: cargo fetch --manifest-path editor/apps/desktop/src-tauri/Cargo.toml --locked
      - run: cargo doc --locked --no-deps --workspace
      # The browser: the facade's entry, the Web Worker transport, the WebRTC link's settings,
      # and the renderer on WebGPU and WebGL2.
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p ludenea -p ludenea-control -p ludenea-net -p ludenea-runtime -p ludenea-webrtc -p boxes -p swarm -p arena --lib -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p ludenea-render --features web --lib -- -D warnings
      # The browser's WebRTC link, which the line above leaves out with its feature.
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p ludenea-webrtc --features link --lib -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p ludenea-runtime --features web --lib -- -D warnings
      # WebAssembly outside the browser: the command line tools that verify the goldens.
      - run: cargo clippy --locked --target wasm32-wasip1 -p boxes -p arena --bins -- -D warnings
      # The runner without a window, as a headless game build links it, and the WebRTC link's
      # settings, which build there without WebRTC.
      - run: cargo clippy --locked --target wasm32-wasip1 -p ludenea-runtime -p ludenea-webrtc --lib -- -D warnings
      # The network crate, tests included: they run under wasmtime in the wasm job.
      - run: cargo clippy --locked --target wasm32-wasip1 -p ludenea-net --all-targets -- -D warnings

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # The golden tests (debug) write the snapshots around a divergence here, in a folder
      # per golden and thread count; the verify steps (release) write theirs under release/.
      # ponytail: only the release verify records a trace after a failure, so a divergence in
      # debug alone uploads its snapshots without one; record a trace in golden.rs's verify if
      # debug and release ever disagree.
      LUDENEA_DUMP_DIR: ${{ github.workspace }}/dump
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # The command line tool's render tests (crates/ludenea-cli/tests/render.rs) draw
      # offscreen: see the render job for the adapter each runner uses. gilrs, the native
      # window's gamepad library, builds against libudev. Xvfb is the display the native
      # window opens on.
      - name: Install lavapipe, libudev and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libudev-dev xvfb
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p ludenea-runtime --features native --all-targets -- -D warnings
      - run: cargo clippy --locked -p ludenea-webrtc --features link --all-targets -- -D warnings
      - id: tests
        run: cargo test --locked --workspace
      - run: cargo test --locked -p ludenea-runtime --features native
      # The native window end to end, on a virtual display and lavapipe: short matches played
      # and recorded, whose replays must verify. Then an online match between two windows
      # through a local signaling listener: both leave at tick 600 and exit 0, and their
      # replays verify and are byte-identical.
      - name: Play and verify a match in the native window
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum cargo run --locked --release -p swarm -- play examples/swarm/assets/swarm.scene.ron --players 1 --ticks 120 --record play/swarm.replay
          cargo run --locked --release -p swarm -- verify play/swarm.replay
          xvfb-run --auto-servernum cargo run --locked --release -p arena -- play examples/arena/assets/arena.scene.ron --players 2 --ticks 600 --record play/arena-native.replay
          cargo run --locked --release -p arena -- verify play/arena-native.replay
          cargo build --locked --release -p ludenea-serve -p arena
          mkdir -p play
          target/release/ludenea rooms --listen 127.0.0.1 > play/rooms.log 2>&1 &
          rooms=$!
          trap 'kill $rooms' EXIT
          for _ in $(seq 300); do
            grep -q '^signaling ' play/rooms.log && break
            kill -0 $rooms 2> /dev/null || break
            sleep 0.1
          done
          grep -q '^signaling ' play/rooms.log || { cat play/rooms.log; exit 1; }
          xvfb-run -a bash -c '
            # A window waits in its room for as long as it stays open: bound each one.
            play="timeout 300 target/release/arena play examples/arena/assets/arena.scene.ron --players 1 --ticks 600 --no-stun --signaling ws://127.0.0.1:3536/rooms"
            $play --host --room 23456A --record play/online-host.replay > play/online-host.log &
            host=$!
            for _ in $(seq 300); do
              grep -q "^room 23456A" play/online-host.log && break
              kill -0 $host 2> /dev/null || break
              sleep 0.1
            done
            grep -q "^room 23456A" play/online-host.log || { kill $host 2> /dev/null; cat play/online-host.log; exit 1; }
            $play --join 23456A --record play/online-join.replay &
            join=$!
            status=0
            wait $host || status=1
            wait $join || status=1
            cat play/online-host.log
            exit $status
          '
          target/release/arena verify play/online-host.replay
          target/release/arena verify play/online-join.replay
          cmp play/online-host.replay play/online-join.replay
      # A tick of the arena's golden replay drawn offscreen, to look at. The textures come from
      # the arena's project folder; a warning (a texture left out, drawn as a placeholder)
      # fails the step.
      - name: Render the arena
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p play
          cargo run --locked --release -p arena -- render golden/arena.replay --project examples/arena --tick 300 --out play/arena.png | tee play/render.log
          ! grep -q '^warning:' play/render.log
      - name: Upload the arena's render
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: arena-render
          path: play/arena.png
      # A divergence fails the golden tests first, so the verify steps run once the tests ran,
      # passed or not, but not after a clippy failure. Every thread count runs, even after one
      # fails, and dumps into a folder of its own.
      - name: Verify the golden trace
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: |
          status=0
          for threads in 1 2 8; do
            dump="$LUDENEA_DUMP_DIR/release/boxes-golden-$threads-threads"
            if ! cargo run --locked --release -p boxes -- verify examples/boxes/assets/boxes.scene.ron --inputs examples/boxes/assets/boxes.inputs --golden golden/boxes.trace --threads $threads --dump-dir "$dump"; then
              status=1
              # A trace over the golden's 10,000 ticks, to compare in the editor. It is a new
              # run: after a divergence between two runs on one machine rather than with the
              # golden, it can diverge at another tick, or not at all.
              cargo run --locked --release -p boxes -- run examples/boxes/assets/boxes.scene.ron --inputs examples/boxes/assets/boxes.inputs --ticks 10000 --threads $threads --trace "$dump/boxes.trace" || echo "::warning::cannot record the trace with --threads $threads"
            fi
          done
          exit $status
      - name: Verify the golden replay
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: |
          status=0
          for threads in 1 2 8; do
            cargo run --locked --release -p boxes -- verify golden/spawner.replay --threads $threads --dump-dir "$LUDENEA_DUMP_DIR/release/boxes-spawner-$threads-threads" || status=1
          done
          exit $status
      - name: Verify the arena's golden replay
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: |
          status=0
          for threads in 1 2 8; do
            cargo run --locked --release -p arena -- verify golden/arena.replay --threads $threads --dump-dir "$LUDENEA_DUMP_DIR/release/arena-replay-$threads-threads" || status=1
          done
          exit $status
      # Each game runs next to a copy that mispredicts and rolls back every tick. A mismatch
      # names the tick, the entities, components and fields that differ, and dumps both
      # snapshots of that tick.
      - name: SyncTest the games
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: |
          status=0
          for threads in 1 8; do
            cargo run --locked --release -p arena -- synctest golden/arena.replay --threads $threads --dump-dir "$LUDENEA_DUMP_DIR/release/arena-synctest-$threads-threads" || status=1
            cargo run --locked --release -p swarm -- synctest examples/swarm/assets/swarm.scene.ron --ticks 600 --random-inputs 1 --threads $threads --dump-dir "$LUDENEA_DUMP_DIR/release/swarm-synctest-$threads-threads" || status=1
            cargo run --locked --release -p boxes -- synctest golden/spawner.replay --threads $threads --dump-dir "$LUDENEA_DUMP_DIR/release/boxes-synctest-$threads-threads" || status=1
          done
          exit $status
      # The arena's rollback property test over 32 seeds per peer and thread count, in release;
      # the workspace tests above run it over 8 in debug.
      - name: Test rollback on the arena over more seeds
        if: ${{ runner.os == 'Linux' && !cancelled() && steps.tests.outcome != 'skipped' }}
        run: cargo test --locked --release -p arena --test rollback
        env:
          LUDENEA_NET_SEEDS: 32
      # A crash or a hash that differs from the golden replay (arena) or the straight run
      # (swarm) fails the job; the timings are only recorded in the job summary, never gated.
      - name: Time a rollback frame
        if: ${{ runner.os == 'Linux' && !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: cargo run --locked --release -p arena --bin rollback-bench | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Time a rollback frame on swarm
        if: ${{ runner.os == 'Linux' && !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: cargo run --locked --release -p swarm --bin rollback-bench | tee -a "$GITHUB_STEP_SUMMARY"
      # One artifact per thread count, with the debug and the release dumps of that count.
      # Steps cannot loop: a thread count added to the verify loops above or to the golden
      # tests (examples/boxes/tests/golden.rs, examples/arena/tests/golden.rs) needs an upload
      # step of its own here.
      - name: Upload the divergence dump at 1 thread
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dump-${{ matrix.os }}-native-1-threads
          path: |
            dump/*-1-threads
            dump/release/*-1-threads
          if-no-files-found: ignore
      - name: Upload the divergence dump at 2 threads
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dump-${{ matrix.os }}-native-2-threads
          path: |
            dump/*-2-threads
            dump/release/*-2-threads
          if-no-files-found: ignore
      - name: Upload the divergence dump at 8 threads
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dump-${{ matrix.os }}-native-8-threads
          path: |
            dump/*-8-threads
            dump/release/*-8-threads
          if-no-files-found: ignore

  # The wgpu renderer's tests, which draw offscreen and read the pixels back, as the command
  # line tool's render tests in the native job do. The Linux and Windows runners have no GPU
  # and use a software adapter: lavapipe (Mesa's Vulkan, installed by both jobs) on Linux and
  # WARP (the built-in Direct3D 12 fallback adapter) on Windows; the macOS runner draws with
  # Metal on its GPU. Without an adapter the tests fail naming what was tried; they never skip.
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p ludenea-render --features gpu --all-targets -- -D warnings
      - run: cargo test --locked -p ludenea-render --features gpu

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Test the network crate
        run: cargo test --locked --target wasm32-wasip1 -p ludenea-net
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=.
      - id: build
        run: cargo build --locked --release --target wasm32-wasip1 -p boxes --bin boxes -p arena --bin arena
      # WebAssembly always runs on one thread. The game reaches only the working directory
      # (--dir=.), so the dumps go to dump/ in it, a folder per golden.
      - name: Verify the golden trace
        run: |
          dump=dump/boxes-golden-1-threads
          if ! wasmtime run --dir=. target/wasm32-wasip1/release/boxes.wasm verify examples/boxes/assets/boxes.scene.ron --inputs examples/boxes/assets/boxes.inputs --golden golden/boxes.trace --dump-dir "$dump"; then
            # A trace over the golden's 10,000 ticks, to compare in the editor. It is a new run:
            # after a divergence between two runs on one machine rather than with the golden,
            # it can diverge at another tick, or not at all.
            wasmtime run --dir=. target/wasm32-wasip1/release/boxes.wasm run examples/boxes/assets/boxes.scene.ron --inputs examples/boxes/assets/boxes.inputs --ticks 10000 --trace "$dump/boxes.trace" || echo "::warning::cannot record the trace"
            exit 1
          fi
      # Runs after a failed trace verify too, but not after a failed build.
      - name: Verify the golden replay
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: wasmtime run --dir=. target/wasm32-wasip1/release/boxes.wasm verify golden/spawner.replay --dump-dir dump/boxes-spawner-1-threads
      - name: Verify the arena's golden replay
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: wasmtime run --dir=. target/wasm32-wasip1/release/arena.wasm verify golden/arena.replay --dump-dir dump/arena-replay-1-threads
      - name: SyncTest the arena
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: wasmtime run --dir=. target/wasm32-wasip1/release/arena.wasm synctest golden/arena.replay --dump-dir dump/arena-synctest-1-threads
      - name: Upload the divergence dump
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dump-ubuntu-24.04-wasm32-wasip1-1-threads
          path: dump/
          if-no-files-found: ignore

  editor:
    runs-on: ubuntu-24.04
    # Above the end-to-end budget (each test at most 20 minutes, and 4 hours in all on
    # CI, `globalTimeout` in playwright.config.ts) plus the builds and checks before it, so a
    # hang is cut off without cutting a cold run short.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # gilrs, the native window's gamepad library, builds against libudev on Linux.
      - name: Install libudev
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      # `target` holds the end-to-end projects' shared target directory, `target/e2e`, as well:
      # the action caches `target` whole and cleans the profiles it finds at any depth, so the
      # nested one is kept like the others.
      - uses: Swatinem/rust-cache@v2
      # The pnpm version comes from `packageManager` in editor/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm -C editor install --frozen-lockfile
      - run: pnpm -C editor exec playwright install --with-deps chromium
      - run: pnpm -C editor build:render
      - run: pnpm -C editor typecheck
      - run: pnpm -C editor test
      # Regenerated from scratch, so a removed or renamed type leaves a stale file behind
      # as a difference too.
      - name: Check the generated files are current
        shell: bash
        run: |
          rm -rf editor/packages/control-client/src/generated
          cargo test --locked -p ludenea-control --test typescript
          cargo test --locked -p ludenea-project --test typescript
          rm crates/ludenea-project/types/*.d.ts
          node editor/scripts/bundle-dts.mjs
          node editor/shared/scripts/export-lists.mjs
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - run: cargo test --locked -p ludenea-project -- --ignored
      - run: cargo test --locked -p ludenea-serve --test play -- --ignored
      - run: cargo xtask wasm-game boxes editor/e2e/golden/pkg
      # The renderer's pixel tests (renderer.spec.ts) load it, on WebGL2 and on WebGPU.
      - run: cargo xtask wasm-render --test-hooks editor/e2e/fixtures/renderer/pkg
      - run: cargo run --locked -p boxes --bin editor-bench
      - run: pnpm -C editor build
      - run: cargo build --locked -p ludenea-serve --features embed-editor
      - run: cargo build --locked -p ludenea-serve
      # The standalone page's tests (standalone.spec.ts) open the swarm and the arena built as
      # web pages and check them against each game's own command line tool, which the arena's
      # editor tests (arena.spec.ts) run too. The online tests (online.spec.ts) play the arena's
      # page against itself and against `arena peer`, through `target/debug/ludenea rooms`.
      - run: cargo build --locked -p swarm -p arena
      - run: cargo run --locked -p ludenea-serve -- build examples/swarm --web --out editor/e2e/fixtures/standalone
      - run: cargo run --locked -p ludenea-serve -- build examples/arena --web --out editor/e2e/fixtures/arena
      # The performance test only reports its numbers here: it asserts on the reference
      # machine (PERF_STRICT=1).
      - run: pnpm -C editor e2e
      - name: Upload the end-to-end results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e
          path: editor/test-results/
          if-no-files-found: ignore

  timing:
    runs-on: macos-14
    # Shared runners measure noisily: the timing and memory budgets are reported, not enforced.
    continue-on-error: true
    # A cold release build plus the tests, with room to spare: a hang is cut off.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run the timing and memory tests in release
        run: cargo test --locked --release -p ludenea-control --test branches --test divergence -- --ignored --nocapture

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # The whole repository: src-tauri patches a crate from vendor/.
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install the WebView libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      # The engine (the viewport renderer) and the Tauri backend, which has a lockfile of its own.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            editor/apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm -C editor install --frozen-lockfile
      # The desktop front end bundles the renderer and the shared modules.
      - run: pnpm -C editor build:render
      - run: pnpm -C editor/shared build
      - run: pnpm -C editor/apps/desktop build
      - run: cargo clippy --manifest-path editor/apps/desktop/src-tauri/Cargo.toml --locked -- -D warnings
      - run: cargo build --manifest-path editor/apps/desktop/src-tauri/Cargo.toml --locked
