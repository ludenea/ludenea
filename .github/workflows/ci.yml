name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-apple-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest,cargo-deny
      # The hash is uploaded before the checks run, so the comparison job
      # still names this target when a check fails.
      - name: Compute the golden hash of the debug and release builds
        run: |
          mkdir -p hashes
          cargo xtask golden-hash > "hashes/${{ matrix.target }}.txt"
          cargo xtask golden-hash --release >> "hashes/${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-hash-${{ matrix.target }}
          path: hashes/
      - run: cargo xtask ci

  wasm:
    name: CI (wasm32-wasip1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasmtime
      - name: Compute the golden hash of the debug and release builds
        run: |
          mkdir -p hashes
          cargo xtask golden-hash --target wasm32-wasip1 > hashes/wasm32-wasip1.txt
          cargo xtask golden-hash --target wasm32-wasip1 --release >> hashes/wasm32-wasip1.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-hash-wasm32-wasip1
          path: hashes/
      - name: Run the core crate tests under wasmtime
        run: cargo test --workspace --exclude xtask --target wasm32-wasip1

  golden-hash:
    name: Golden hash comparison
    needs: [ci, wasm]
    # Runs when a target failed too, to report every diverging hash at once.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: golden-hash-*
          path: hashes
          merge-multiple: true
      # Lists every target of the ci and wasm jobs: a target whose build
      # failed before uploading its hash fails the comparison.
      - run: >-
          cargo xtask golden-compare hashes
          x86_64-unknown-linux-gnu
          aarch64-unknown-linux-gnu
          x86_64-pc-windows-msvc
          aarch64-apple-darwin
          wasm32-wasip1
