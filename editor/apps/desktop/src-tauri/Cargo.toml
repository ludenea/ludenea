[package]
name = "ludenea-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
ludenea-project = { path = "../../../../crates/ludenea-project" }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tokio = { version = "1.53.3", features = ["sync"] }

# Built on its own (the engine workspace excludes it), with its own lockfile.
[workspace]

# As in the engine workspace: rolldown_common 1.2.14 from crates.io forces serde_json's
# `arbitrary_precision`, which breaks reading numbers inside internally tagged protocol enums.
[patch.crates-io]
rolldown_common = { path = "../../../../vendor/rolldown_common" }
