# Workspace of the throwaway research spikes. Spikes share nothing but this
# workspace, the pinned toolchain and the reference workload (see README.md).
[workspace]
resolver = "3"
members = [
    "platform-facts",
    "platform-threading-constraints",
    "reference-workload",
    "workload-worker-sweep",
    "workload-scheduling-overhead",
    "workload-storage-layouts",
    "workload-structural-changes",
    "runtime-skeleton",
    "runtime-skeleton/core",
    "runtime-skeleton/presentation",
    "runtime-skeleton/facade",
    "workload-frame-allocator",
    "workload-schema",
    "control-surface-toy",
    "workload-history-capture",
    "control-surface-data-plane",
    "control-surface-editor-rate",
    "headless-modes",
    "workload-test-harness",
    "workload-lockstep",
    "render-offscreen",
    "workload-render-extraction",
    "workload-asset-arrival",
    "plugin-tiers",
    "plugin-tiers/motion-crate",
    "plugin-tiers/motion-module",
    "plugin-tiers/motion-native",
    "workload-persistent-pool",
    "asset-import-parallel",
    "workload-scene-streaming",
    "workload-nested-overrides",
    "test-recording-round-trip",
    "input-records-from-device-events",
    "audio-forms-and-threads",
    "rapier-snapshot-continuation",
    "scripting-runtime",
    "scripting-runtime/systems",
    "scripting-runtime/module",
    "render-device-baseline",
    "workload-asset-table",
    "asset-import-graph",
    "render-backend-comparison",
    "shader-forms-across-platforms",
]

[profile.release]
debug = 1
