# Workspace of the throwaway research spikes. Spikes share nothing but this
# workspace, the pinned toolchain and the reference workload (see README.md).
[workspace]
resolver = "3"
members = ["platform-facts", "platform-threading-constraints", "reference-workload", "workload-worker-sweep", "workload-scheduling-overhead", "workload-storage-layouts", "workload-structural-changes"]

[profile.release]
debug = 1
