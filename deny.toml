# Dependency policy checked by `cargo deny check`, run in `cargo xtask ci`.

[graph]
all-features = true

[advisories]
# Unmaintained or unsound crates fail the check, not only vulnerable ones.
unmaintained = "all"
yanked = "deny"

[licenses]
# Permissive licenses only: compatible with both MIT OR Apache-2.0 (the
# engine) and the AGPLv3 (the editor). Widen deliberately, one at a time.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The allow list is a policy, not an inventory of current dependencies.
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    # TLS goes through rustls, never a system OpenSSL.
    { crate = "openssl" },
    { crate = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
