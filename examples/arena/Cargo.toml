[package]
name = "arena"
version = "0.1.0"
edition.workspace = true
publish = false
default-run = "arena"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "arena"
path = "src/main.rs"

# Same name as the `record-replay` of boxes: skip it in `cargo doc`, whose output paths would
# collide.
[[bin]]
name = "record-replay"
doc = false

[features]
# The standalone web page (`ludenea build --web`).
web = ["ludenea/web"]

[dependencies]
ludenea.workspace = true
serde.workspace = true

[dev-dependencies]
png.workspace = true
postcard.workspace = true
ron.workspace = true
