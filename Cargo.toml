[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"

[profile.release]
overflow-checks = true

[profile.dev]
opt-level = 1

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
ron = "0.12.2"
syn = "3.0.9"
quote = "1.0.47"
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
rayon = "1.12.0"
ludenea-math = { path = "crates/ludenea-math" }
ludenea-app = { path = "crates/ludenea-app" }
ludenea-ecs = { path = "crates/ludenea-ecs" }
ludenea-macros = { path = "crates/ludenea-macros" }
