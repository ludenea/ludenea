[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ludenea/ludenea"

[workspace.dependencies]
cargo_metadata = "0.23.1"
insta = "1.49.0"
ludenea_math = { path = "crates/math", version = "0.0.0" }
# Without the default `fork` and `timeout` features, which do not build for
# WebAssembly.
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Silencing a lint goes through `#[expect(..., reason = "...")]`, so a
# silenced lint is justified and flagged again once it no longer fires.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
