[workspace]
members = ["crates/*", "examples/*", "xtask"]
exclude = ["vendor", "editor/apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"

[profile.release]
overflow-checks = true

[profile.dev]
opt-level = 1

# The browser renderer, downloaded by every browser editor and game: built for size (`cargo
# xtask wasm-render`).
[profile.wasm-render]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
ron = "0.12.2"
base64 = "0.23.1"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
syn = "3.0.9"
quote = "1.0.47"
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
rayon = "1.12.0"
uuid = { version = "1.28.0", features = ["v4"] }
libc = "0.2.191"
toml = "1.1.8"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-cli-support = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
wgpu = { version = "=30.0.1", default-features = false }
png = "=0.18.1"
pollster = "=1.0.1"
# The native window and gamepads of `ludenea-runtime`: winit 0.30 is the newest stable line (0.31
# is in beta) and speaks raw-window-handle 0.6, as wgpu 30 does.
winit = "=0.30.13"
gilrs = "=0.11.2"
cargo_metadata = "0.23.1"
# Every rolldown crate on the same exact version: they are released together.
rolldown = "=1.2.14"
rolldown_common = "=1.2.14"
rolldown_error = "=1.2.14"
rolldown_plugin = "=1.2.14"
tokio = { version = "1.53.3", features = ["rt"] }
axum = { version = "0.8.9", features = ["ws"] }
# The version axum's WebSocket uses, so the error of a message over the size limit downcasts
# to it.
tungstenite = "0.29.0"
# The signaling messages of matchbox_socket, which the WebRTC link uses: the listener speaks
# the client's own types. Exact, as the two must agree.
matchbox_protocol = { version = "=0.14.0", features = ["json"] }
# The WebRTC link's socket, natively (webrtc-rs) and in the browser: one stack for both, so
# native and browser peers meet in the same rooms. Exact, as `vendor/matchbox_socket` patches
# this version.
matchbox_socket = "=0.14.0"
# The executor the native link runs matchbox_socket's message loop on, in a thread of its own.
futures = { version = "=0.3.34", default-features = false, features = ["executor"] }
# The WebSocket client matchbox_socket uses natively: the native link reads the HTTP status of
# a refused room from its error. Exact, as the two must agree.
async-tungstenite = { version = "=0.32.1", default-features = false }
ludenea-math = { path = "crates/ludenea-math" }
ludenea-app = { path = "crates/ludenea-app" }
ludenea-ecs = { path = "crates/ludenea-ecs" }
ludenea-schema = { path = "crates/ludenea-schema" }
ludenea-macros = { path = "crates/ludenea-macros" }
ludenea-physics = { path = "crates/ludenea-physics" }
ludenea-draw = { path = "crates/ludenea-draw" }
ludenea-render = { path = "crates/ludenea-render" }
ludenea-control = { path = "crates/ludenea-control" }
ludenea-cli = { path = "crates/ludenea-cli" }
ludenea-net = { path = "crates/ludenea-net" }
ludenea-runtime = { path = "crates/ludenea-runtime" }
ludenea = { path = "crates/ludenea" }
ludenea-project = { path = "crates/ludenea-project" }
ludenea-signal = { path = "crates/ludenea-signal" }
ludenea-webrtc = { path = "crates/ludenea-webrtc" }

# rolldown_common 1.2.14 from crates.io with its serde_json dependency no longer requesting the
# `arbitrary_precision` feature. Cargo unifies features, so that feature reached every
# serde_json in builds that include ludenea-project and broke deserializing numbers inside
# internally tagged protocol enums. Without the feature, `json_to_program.rs` reads JSON numbers
# with `as_f64` instead of `as_str`, and its inline test of numbers beyond f64 (which only parse
# with the feature) is deleted. Drop the patch once upstream makes the feature optional.
#
# ron 0.12.2 from crates.io with one change: when it parses a number without knowing its type
# (`RawValue`, which scenes use), it no longer searches the whole rest of the document for
# "..". That search made loading a scene quadratic in its size (minutes for 100,000 entities).
# The project template carries the same patch. Drop it once upstream bounds the search.
#
# matchbox_socket 0.14.0 from crates.io with these changes. An empty list of ICE URLs gives no
# ICE server, natively and in the browser (`create_rtc_peer_connection` of `native.rs` and
# `wasm.rs`), instead of one server without URLs, which Chromium refuses. And every `unwrap`
# or `expect` that signaling or peer data could reach now drops that peer's handshake with a
# `warn!` (`or_drop` in `mod.rs`), and the socket carries on with its other peers. Every peer
# connection is closed once its handshake is dropped, its peer loop ends, or the message loop
# is dropped, since neither webrtc-rs nor the browser frees one left open: `offer_handshake`
# (131, 112) and `accept_handshake` (216, 208) of `native.rs` and `wasm.rs` wrap it in a
# `ClosingConnection`, whose drop closes it, and hand it to `peer_loop` (291, 313) through
# `HandshakeMeta` (124, 110). Natively the guard keeps the tokio runtime the connection was
# made on (async-compat's, inside `.compat()`) and spawns the close there, since it may be
# dropped on the message loop's own executor (so `Cargo.toml` adds `tokio`, already a
# dependency of webrtc); the close first waits up to 5 s for the candidates' gathering, since
# webrtc-rs leaks the sockets of a gathering a close interrupts.
# The sites, by their line in the 0.14.0 sources:
# - `native.rs`: in `offer_handshake`, the peer connection (147), the local offer (163, 165),
#   a signaling connection or peer lost before the answer (172), and a malformed or unusable
#   answer (187, 191); in `accept_handshake`, the peer connection (232), a signaling
#   connection or peer lost before the offer (248), a malformed or unusable offer (258,
#   262), and the local answer (264, 266); in `complete_handshake`, signals that end before
#   the data channels open (362), when the peer or the signaling connection left, drop the
#   handshake; in `listen_for_remote_candidates`, a candidate webrtc-rs refuses is skipped
#   with a `warn!` instead of ending the candidates, so the end of the signals is still seen
#   (429); a data channel that opens once its handshake was dropped (545, in
#   `create_data_channel`).
# - `wasm.rs`: in `offer_handshake`, the peer connection (121), the local offer (138 to 149,
#   158), a signaling connection or peer lost before the answer (167), and an unusable answer
#   (187 to 190); in `accept_handshake`, the peer connection (217), a signaling connection or
#   peer lost before the offer (239), an unusable offer (261 to 263), and the local answer
#   (267 to 286, 294); in `complete_handshake`, signals that end before the data channels
#   open (365); in `try_add_rtc_ice_candidate`, a candidate the browser refuses is skipped
#   with a `warn!`, as natively, instead of panicking (413); the peer connection's
#   configuration (431, 432); a data channel that opens once its handshake was dropped (526,
#   in `create_data_channel`).
# - `mod.rs`, `message_loop`: a second `IdAssigned` is ignored (224), a packet for a peer
#   without that data channel is dropped (277 to 280), a dropped handshake is skipped, and a
#   peer that leaves (`PeerLeft`) ends the handshake still waiting for its signals.
# - `signal_peer.rs`: a signal sent once the signaling loop ended is dropped (16).
# - `socket.rs`: `try_next`, deprecated in futures-channel 0.3.34, becomes `try_recv` (332,
#   565), with the same behaviour.
# Drop the patch once upstream takes no ICE server, frees an abandoned handshake, and never
# panics on peer data.
[patch.crates-io]
rolldown_common = { path = "vendor/rolldown_common" }
ron = { path = "vendor/ron" }
matchbox_socket = { path = "vendor/matchbox_socket" }
