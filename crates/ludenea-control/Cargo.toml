[package]
name = "ludenea-control"
version = "0.1.0"
edition.workspace = true

[features]
# TypeScript bindings of the protocol; off by default to keep simulation builds lean.
ts = ["dep:ts-rs", "ludenea-app/ts", "ludenea-ecs/ts", "ludenea-draw/ts", "ludenea-math/ts"]

[dependencies]
ts-rs = { workspace = true, optional = true }
ludenea-app.workspace = true
ludenea-ecs.workspace = true
ludenea-draw.workspace = true
ludenea-math.workspace = true
base64.workspace = true
serde.workspace = true
postcard.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen.workspace = true

[dev-dependencies]
boxes = { path = "../../examples/boxes" }
ludenea.workspace = true
ludenea-control = { path = ".", features = ["ts"] }
ts-rs.workspace = true
xxhash-rust.workspace = true
