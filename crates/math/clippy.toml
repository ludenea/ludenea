# Determinism lints: code that would make two runs of the simulation, or
# the same run on two platforms, diverge. Each reason names the allowed
# alternative.
#
# The simulation crates (math, sim, ecs) each hold an identical copy of this
# file; a test in xtask fails when the copies differ or when an entry stops
# being reported. These lints only see workspace code: dependencies are
# vetted by `cargo deny` and the boundaries check of `cargo xtask`.

disallowed-methods = [
    { path = "f32::mul_add", reason = "fused multiply-add rounds once and differs from a * b + c on platforms without it, write a * b + c" },
    { path = "f32::sin", reason = "platform implementations round differently, use the libm-backed function in ludenea_math" },
    { path = "f32::cos", reason = "platform implementations round differently, use the libm-backed function in ludenea_math" },
