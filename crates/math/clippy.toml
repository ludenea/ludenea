disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order depends on a per-run random seed, use BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order depends on a per-run random seed, use BTreeSet" },
    { path = "std::hash::RandomState", reason = "seeded from OS randomness on every run, use BTreeMap or BTreeSet" },
    { path = "std::hash::DefaultHasher", reason = "its algorithm may change between Rust releases, hash with a specified algorithm" },
    { path = "std::time::Instant", reason = "reads the wall clock, measure time in simulation ticks" },
    { path = "std::time::SystemTime", reason = "reads the wall clock, measure time in simulation ticks" },
]
