[package]
name = "ludenea-signal"
version = "0.1.0"
edition.workspace = true

[dependencies]
axum.workspace = true
# The connection builder axum's own `serve` uses, which also bounds the time a request's
# headers may take.
hyper-util = { version = "0.1.21", features = ["http1", "server", "service", "tokio"] }
ludenea-net.workspace = true
matchbox_protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "sync", "time"] }
tungstenite.workspace = true
uuid.workspace = true

[dev-dependencies]
matchbox_protocol.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tungstenite.workspace = true
