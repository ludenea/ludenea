[package]
name = "ludenea"
version = "0.1.0"
edition.workspace = true

[features]
# The standalone web page's exports (`ludenea build --web` builds a game with it), in the
# browser only.
web = ["ludenea-runtime/web"]

[dependencies]
ludenea-app.workspace = true
ludenea-cli.workspace = true
ludenea-draw.workspace = true
ludenea-control.workspace = true
ludenea-ecs.workspace = true
ludenea-math.workspace = true
ludenea-net.workspace = true
ludenea-physics.workspace = true
ludenea-render.workspace = true
ludenea-runtime.workspace = true
ludenea-schema.workspace = true
serde.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen.workspace = true

[dev-dependencies]
ludenea-project.workspace = true
