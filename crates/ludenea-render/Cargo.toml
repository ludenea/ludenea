[package]
name = "ludenea-render"
version = "0.1.0"
edition.workspace = true

[features]
# The wgpu renderer (`gpu`). Off by default: the simulation never pulls a GPU crate.
gpu = ["dep:wgpu"]

[dependencies]
ludenea-app.workspace = true
ludenea-draw.workspace = true
ludenea-ecs.workspace = true
ludenea-math.workspace = true
png.workspace = true
serde.workspace = true
thiserror.workspace = true

# Native backends on native targets; the browser backends arrive with the web wrapper.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, optional = true, features = ["std", "wgsl", "metal", "vulkan", "dx12"] }

[dev-dependencies]
boxes = { path = "../../examples/boxes" }
ludenea-physics.workspace = true
pollster.workspace = true
ron.workspace = true
