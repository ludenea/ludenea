[package]
name = "ludenea-project"
version = "0.1.0"
edition.workspace = true

[features]
# TypeScript bindings of the project protocol; off by default.
ts = ["dep:ts-rs", "ludenea-app/ts", "ludenea-control/ts", "ludenea-ecs/ts"]

[dependencies]
cargo_metadata.workspace = true
ludenea-app.workspace = true
ludenea-control.workspace = true
ludenea-ecs.workspace = true
ludenea-render.workspace = true
ludenea-schema.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
ron.workspace = true
rolldown.workspace = true
rolldown_common.workspace = true
rolldown_error.workspace = true
rolldown_plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true
ts-rs = { workspace = true, optional = true }
wasm-bindgen-cli-support.workspace = true
xxhash-rust.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
boxes = { path = "../../examples/boxes" }
tempfile.workspace = true
ludenea-project = { path = ".", features = ["ts"] }
ts-rs.workspace = true
