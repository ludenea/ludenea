[package]
name = "ludenea-serve"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "ludenea"
path = "src/main.rs"
# Its documentation would land at `ludenea/index.html`, over the engine facade's.
doc = false

[features]
# Embeds the editor build (`editor/apps/web/dist`, which must exist) instead of serving
# `--editor-dir`.
embed-editor = ["dep:include_dir"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap.workspace = true
include_dir = { version = "0.7.4", optional = true }
ludenea-project.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# The version axum's WebSocket uses, so the error of a message over the size limit downcasts
# to it.
tungstenite = "0.29.0"

[dev-dependencies]
ludenea-project.workspace = true
serde_json.workspace = true
tempfile.workspace = true
