[package]
name = "ludenea-runtime"
version = "0.1.0"
edition.workspace = true

[features]
# The native window: winit, gilrs, the wgpu renderer, and the texture watcher (notify), on
# native targets only. Without it the runtime depends on no window, gamepad, GPU, or file
# watcher crate.
native = [
    "dep:winit",
    "dep:gilrs",
    "dep:ludenea-render",
    "dep:wgpu",
    "dep:pollster",
    "dep:notify",
    "dep:notify-debouncer-full",
    "dep:xxhash-rust",
]
# The standalone web page's exports (the lobby, and the browser renderer it links), in the
# browser only: the renderer's `web` feature and wasm-bindgen are declared for
# `wasm32-unknown-unknown` alone. Cargo cannot limit a feature to a target, so on any other
# target the feature still enables the renderer as the native window has it (`gpu`: wgpu on the
# native backends). Only a game's browser build turns it on (`ludenea build --web`), as
# `ludenea-render`'s own `web` feature does.
web = ["dep:ludenea-render", "dep:wasm-bindgen", "dep:serde_json"]

[dependencies]
ludenea-app.workspace = true
ludenea-control.workspace = true
ludenea-draw.workspace = true
ludenea-ecs.workspace = true
ludenea-math.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gilrs = { workspace = true, optional = true }
ludenea-render = { workspace = true, optional = true, features = ["gpu"] }
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
xxhash-rust = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
ludenea-render = { workspace = true, optional = true, features = ["web"] }
serde_json = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
ludenea.workspace = true
png.workspace = true
postcard.workspace = true
serde.workspace = true
swarm = { path = "../../examples/swarm" }
tempfile.workspace = true
