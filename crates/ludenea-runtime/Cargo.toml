[package]
name = "ludenea-runtime"
version = "0.1.0"
edition.workspace = true

[features]
# The native window: winit, gilrs, the wgpu renderer, and the texture watcher (notify), on
# native targets only, and the WebRTC link of native peers (`online::open_link`), with the
# entropy of their plans (uuid). Without it the runtime depends on no window, gamepad, GPU,
# or file watcher crate.
native = [
    "dep:winit",
    "dep:gilrs",
    "dep:ludenea-render",
    "dep:wgpu",
    "dep:pollster",
    "dep:notify",
    "dep:notify-debouncer-full",
    "dep:xxhash-rust",
    "dep:uuid",
    "ludenea-webrtc/link",
]
# The standalone web page's exports (the lobby, the online room, and the browser renderer it
# links), in the browser only: the renderer's `web` feature and wasm-bindgen are declared for
# `wasm32-unknown-unknown` alone. Cargo cannot limit a feature to a target, so on any other
# target the feature still enables the renderer as the native window has it (`gpu`: wgpu on the
# native backends). Only a game's browser build turns it on (`ludenea build --web`), as
# `ludenea-render`'s own `web` feature does.
web = [
    "dep:ludenea-render",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:serde_json",
    "ludenea-webrtc/link",
]

[dependencies]
ludenea-app.workspace = true
ludenea-control.workspace = true
ludenea-draw.workspace = true
ludenea-ecs.workspace = true
ludenea-math.workspace = true
ludenea-net.workspace = true
# Its settings on every target (`OnlinePlan` holds them); the link itself (feature `link`)
# only with `native` or `web`, so a build without them links no WebRTC.
ludenea-webrtc.workspace = true
# The JSON of the web page's exports; the online options it reads are checked on every target.
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gilrs = { workspace = true, optional = true }
ludenea-render = { workspace = true, optional = true, features = ["gpu"] }
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
# The entropy of a native peer's plan; the web page passes its own.
uuid = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
xxhash-rust = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
ludenea-render = { workspace = true, optional = true, features = ["web"] }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

[dev-dependencies]
arena = { path = "../../examples/arena" }
ludenea.workspace = true
png.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
swarm = { path = "../../examples/swarm" }
tempfile.workspace = true
